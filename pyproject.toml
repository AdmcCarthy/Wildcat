[project]
name = "wildcat"
version = "0.1.0"
description = "Wildcat: a SubScout data story on fifty years of Norwegian exploration wells"
requires-python = ">=3.12"
dependencies = [
    "subscout[export]",
]

[dependency-groups]
pipeline = [
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=16",
    "shapely>=2.0",
    "pyproj>=3.6",
    "openpyxl>=3.1.5",
]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.uv.sources]
subscout = { git = "https://github.com/AdmcCarthy/SubScout", tag = "v0.5.0" }

[tool.pytest.ini_options]
pythonpath = ["scripts"]
